# DevOps Hub — static portal module
# Used when this repo is mounted as /opt/ops/hub

services:
  hub:
    image: nginx:alpine
    container_name: ops_hub
    restart: always
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./ops/modules/hub.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - opsnet

networks:
  opsnet:
    external: true
