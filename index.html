<!DOCTYPE html>
<!-- Корінь https://s.ks.tv: поки що лише чіпи. Повний портал (основний далі) — shadow.html. -->
<html lang="uk" data-hub-service="hub">
<script data-theme-boot>document.documentElement.setAttribute("data-theme",(function(){try{var m=localStorage.getItem("ops_theme")||localStorage.getItem("oncall_theme")||"system";if(m==="light"||m==="dark")return m;return matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}catch(e){return"dark"}})());</script>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DevOps Hub</title>
  <meta name="description" content="Чіпи фахівців DevOps Hub." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="chrome.css" />
  <style>
    #roster { margin-top: 1.25rem; }
    #hub-roster.roster-row {
      justify-content: center;
      align-items: stretch;
      gap: 10px;
    }
    #hub-roster .spec-chip {
      align-items: center;
      text-align: center;
      justify-content: center;
      box-sizing: border-box;
    }
    #hub-roster .spec-name,
    #hub-roster .spec-sub {
      text-align: center;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <header class="header">
    <div class="brand">
      <span class="logo">◈</span>
      <div>
        <strong>DevOps Hub</strong>
        <span class="tag">фахівці</span>
      </div>
    </div>
    <div class="theme-switch" title="Тема">
      <button type="button" data-theme-btn="system" onclick="opsSetTheme('system')">Авто</button>
      <button type="button" data-theme-btn="light" onclick="opsSetTheme('light')">☀</button>
      <button type="button" data-theme-btn="dark" onclick="opsSetTheme('dark')">☾</button>
    </div>
    <nav class="nav">
      <button type="button" class="btn" id="hub-login-btn" onclick="hubLoginClick()">Увійти</button>
      <span id="hub-who" class="tag"></span>
      <span id="hub-date-chip" class="date-chip">дата</span>
      <div class="nav-dd" id="hub-tools-dd">
        <button type="button" class="btn" onclick="document.getElementById('hub-tools-menu').classList.toggle('open')">Інструменти ▾</button>
        <div id="hub-tools-menu" class="nav-menu"></div>
      </div>
      <a href="/shadow.html">Портал</a>
    </nav>
  </header>

  <main>
    <section id="roster" class="section">
      <div id="hub-roster" class="roster-row"><p class="muted">Завантаження…</p></div>
    </section>
  </main>

  <script src="theme.js"></script>
  <script src="chrome.js"></script>
  <script>
    function equalizeChips() {
      const row = document.getElementById("hub-roster");
      if (!row) return;
      const chips = [...row.querySelectorAll(".spec-chip")];
      if (!chips.length) return;
      chips.forEach((c) => { c.style.width = "auto"; });
      let max = 0;
      chips.forEach((c) => { max = Math.max(max, c.getBoundingClientRect().width); });
      const w = Math.ceil(max);
      chips.forEach((c) => { c.style.width = w + "px"; });
    }
    const row = document.getElementById("hub-roster");
    if (row) {
      new MutationObserver(() => requestAnimationFrame(equalizeChips))
        .observe(row, { childList: true, subtree: true });
    }
    window.addEventListener("resize", () => requestAnimationFrame(equalizeChips));
    window.addEventListener("load", () => requestAnimationFrame(equalizeChips));
  </script>
</body>
</html>
