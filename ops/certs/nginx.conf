server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    default_type text/html;
    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /status.json {
        default_type application/json;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }
}
