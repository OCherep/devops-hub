<!DOCTYPE html>
<html lang="uk">
<script data-theme-boot>document.documentElement.setAttribute("data-theme",(function(){try{var m=localStorage.getItem("ops_theme")||localStorage.getItem("oncall_theme")||"system";if(m==="light"||m==="dark")return m;return matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}catch(e){return"dark"}})());</script>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Certificates SSL/TLS · DevOps Hub</title>
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/styles.css">
<style>
  main.certs { max-width:1100px; margin:0 auto; padding:1.5rem 1.25rem 3rem; }
  .st.ok { color: var(--good) } .st.expiring { color: var(--warn) } .st.expired { color: var(--bad) }
</style>
</head>
<body>
  <div class="bg"></div>
  <header class="header">
    <div class="brand">
      <span class="logo">◈</span>
      <div>
        <strong>Certificates SSL/TLS</strong>
        <span class="tag">інвентар · ZeroSSL / LE / ACM</span>
      </div>
    </div>
    <div class="theme-switch">
      <button type="button" data-theme-btn="system" onclick="opsSetTheme('system')">Авто</button>
      <button type="button" data-theme-btn="light" onclick="opsSetTheme('light')">☀</button>
      <button type="button" data-theme-btn="dark" onclick="opsSetTheme('dark')">☾</button>
    </div>
    <nav class="nav">
      <a href="/">Hub</a>
      <a href="/radar/">Radar</a>
      <a href="https://s.ks.tv:85/">OnCall</a>
    </nav>
  </header>
  <main class="certs">
    <p class="eyebrow">PLATFORM TLS</p>
    <h1>Статус сертифікатів</h1>
    <p class="lead" id="meta">Завантаження…</p>
    <p><button class="btn primary" type="button" onclick="load()">Оновити</button></p>
    <div class="card" style="overflow:auto">
      <table>
        <thead><tr><th>Статус</th><th>Днів</th><th>Імʼя</th><th>Issuer</th><th>Джерело</th><th>notAfter</th></tr></thead>
        <tbody id="tb"><tr><td colspan="6">—</td></tr></tbody>
      </table>
    </div>
  </main>
  <script src="/theme.js"></script>
  <script>
  async function load(){
    const tb=document.getElementById('tb');
    const meta=document.getElementById('meta');
    try{
      const r=await fetch('inventory.json',{cache:'no-store'}).catch(()=>fetch('status.json',{cache:'no-store'}));
      if(!r.ok) throw new Error('status.json HTTP '+r.status);
      const rows=await r.json();
      const list=Array.isArray(rows)?rows:[];
      meta.textContent = list.length ? ('Сертифікатів: '+list.length) : 'Порожньо — bash /opt/ops/certs/inventory.sh';
      tb.innerHTML = list.length ? list.sort((a,b)=>(a.days_left??9999)-(b.days_left??9999)).map(x=>
        `<tr><td class="st ${x.status||''}">${x.status||'—'}</td><td>${x.days_left??'—'}</td><td>${esc(x.name)}</td><td>${esc(x.issuer)}</td><td>${esc(x.source)}</td><td>${esc(x.not_after)}</td></tr>`
      ).join('') : '<tr><td colspan="6">Немає даних</td></tr>';
    }catch(e){
      meta.textContent = String(e.message||e);
      tb.innerHTML = '<tr><td colspan="6">Немає status.json</td></tr>';
    }
  }
  function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
  load();
  </script>
</body>
</html>
