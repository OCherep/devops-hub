services:
  caddy:
    image: caddy:2-alpine
    container_name: ops_edge
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - opsnet

networks:
  opsnet:
    external: true

volumes:
  caddy_data:
  caddy_config:
