# Module: ether
# Overlay control plane landing. Full app: OCherep/ether@grok-0.0.1
# One directory /opt/ops/ether. Only Docker on the host. opsnet.

services:
  app:
    image: nginx:alpine
    container_name: ops_ether
    restart: always
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - opsnet

networks:
  opsnet:
    external: true
