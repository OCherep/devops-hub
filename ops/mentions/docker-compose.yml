services:
  mentions:
    build: .
    container_name: ops_mentions
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_USER_TOKEN: ${SLACK_USER_TOKEN:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      SLACK_DEVOPS_GROUP: ${SLACK_DEVOPS_GROUP:-devops-team}
      PORT: "8091"
      ONCALL_API: ${ONCALL_API:-http://oncall_nginx_5}
      ONCALL_READ_TOKEN: ${ONCALL_READ_TOKEN:-}
      HUB_ORIGIN: ${HUB_ORIGIN:-https://s.ks.tv}
    networks: [opsnet]
    volumes:
      - ./ui:/app/ui:ro
    expose: ["8091"]
networks:
  opsnet:
    external: true
