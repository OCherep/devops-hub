<!DOCTYPE html>
<html lang="uk" data-hub-service="slack-mentions">
<script>document.documentElement.setAttribute("data-theme",(function(){try{var m=localStorage.getItem("ops_theme")||"dark";if(m==="light"||m==="dark")return m;return matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}catch(e){return"dark"}})());</script>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slack Mentions · DevOps</title>
<link rel="stylesheet" href="/theme.css"><link rel="stylesheet" href="/chrome.css">
<style>
body{margin:0;background:var(--bg,#0b1020);color:var(--text,#e8eefc);font:14px/1.45 system-ui,sans-serif}
main{max-width:1200px;margin:0 auto;padding:24px 16px}
.kw{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 16px}
.kw button{border:1px solid var(--border,#243056);background:transparent;color:inherit;border-radius:999px;padding:4px 10px;cursor:pointer}
.kw button.on{background:#1d4ed8;border-color:#3b82f6}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--border,#243056);vertical-align:top}
tr.exp td{background:color-mix(in srgb,#3b82f6 8%, transparent)}
.mono{font-family:ui-monospace,monospace;font-size:12px}
.muted{color:var(--muted,#9aa8c7)}
header.top{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--border,#243056)}
</style>
</head>
<body>
<header class="top">
  <strong>Slack Mentions</strong>
  <div style="display:flex;gap:8px;align-items:center">
    <div class="theme-switch">
      <button type="button" data-theme-btn="system" onclick="opsSetTheme('system')">Авто</button>
      <button type="button" data-theme-btn="light" onclick="opsSetTheme('light')">☀</button>
      <button type="button" data-theme-btn="dark" onclick="opsSetTheme('dark')">☾</button>
    </div>
    <span id="hub-date-chip" class="date-chip"></span>
    <button class="btn" id="hub-login-btn">Увійти</button><span id="hub-who"></span>
    <div class="nav-dd"><button class="btn" type="button" onclick="document.getElementById('hub-tools-menu').classList.toggle('open')">Інструменти ▾</button>
      <div id="hub-tools-menu" class="nav-menu"></div></div>
  </div>
</header>
<main>
  <p class="muted">Згадки @devops-team і окремих членів у Slack. Postgres schema mentions.* · пізніше зв’язок з OnCall roster.</p>
  <label>День <input type="date" id="day"></label>
  <label style="margin-left:12px"><input type="checkbox" id="hist"> історія 14 днів</label>
  <button type="button" class="btn" id="bf">Підтягнути зі Slack</button>
  <span id="bfst" class="muted"></span>
  <h2>Ключові слова сьогодні</h2>
  <div class="kw" id="kw"></div>
  <h2>Команда <span id="team-crumb" class="muted"></span></h2>
  <table><thead><tr><th>Хто / автор</th><th>Тип</th><th>Усього</th><th>Сьогодні</th><th>Останнє</th></tr></thead>
    <tbody id="people"></tbody></table>
  <h2 id="list-title">Усі згадки за день</h2>
  <table><thead><tr><th></th><th>Час</th><th>Чат</th><th>Автор</th><th>Кому</th><th>Повідомлення</th><th>↩ / ☺</th><th>Slack</th></tr></thead>
    <tbody id="rows"></tbody></table>
</main>
<script src="/theme.js"></script>
<script src="/chrome.js"></script>
<script>
const API="/mentions/api";
const dayEl=document.getElementById("day");
dayEl.value=new Date().toISOString().slice(0,10);
document.getElementById("hist").checked=false;
let filterWho="", filterKw="";
function qs(){
  const h=document.getElementById("hist").checked?"1":"0";
  return "day="+dayEl.value+"&history="+h+(filterWho?"&who="+encodeURIComponent(filterWho):"")+((window._layer&&window._layer.author)?"&author="+encodeURIComponent(window._layer.author):"");
}

const EMO={
  "+1":"👍","-1":"👎","thumbsup":"👍","thumbsdown":"👎","ok_hand":"👌",
  "clap":"👏","wave":"👋","pray":"🙏","heart":"❤️","hearts":"💕",
  "fire":"🔥","tada":"🎉","star":"⭐","eyes":"👀","thinking_face":"🤔",
  "smile":"😄","smiley":"😃","grin":"😁","laughing":"😆","joy":"😂",
  "slightly_smiling_face":"🙂","wink":"😉","blush":"😊","innocent":"😇",
  "heart_eyes":"😍","kissing_heart":"😘","sweat_smile":"😅","sweat":"😓",
  "cry":"😢","sob":"😭","scream":"😱","rage":"😡","confused":"😕",
  "white_check_mark":"✅","heavy_check_mark":"✔️","x":"❌","warning":"⚠️",
  "question":"❓","exclamation":"❗","100":"💯","rocket":"🚀","boom":"💥",
  "beer":"🍺","coffee":"☕","pizza":"🍕","thumbsup_all":"👍",
  "raised_hands":"🙌","muscle":"💪","ok":"🆗","v":"✌️","point_up":"☝️"
};
function emojify(s){
  s=String(s||"");
  s=s.replace(/:([+a-z0-9_]+)(?:::skin-tone-[0-9])?:/gi,function(_,n){n=n.toLowerCase().replace(/::skin-tone-[0-9]/,"");return EMO[n]||"";});
  return s;
}
function rxHtml(rx){
  rx=Array.isArray(rx)?rx:(function(){try{return JSON.parse(rx||"[]")}catch(e){return []}})();
  return rx.map(function(r){
    const raw=r.name||"";
    const face=EMO[raw]||emojify(":"+raw+":");
    const who=(r.users&&r.users.length)?" "+r.users.join(", "):"";
    return '<span title="'+raw+who+'">'+face+" "+(r.count||0)+"</span>";
  }).join(" ");
}
function rxHtmlUnused(rx){
  rx=Array.isArray(rx)?rx:(function(){try{return JSON.parse(rx||"[]")}catch(e){return []}})();
  return rx.map(r=>":"+(r.name||"")+": "+(r.count||0)+((r.users&&r.users.length)?" ("+r.users.join(", ")+")":"")).join(" · ");
}
function renderItems(items){
  items=items||[];
  if(filterKw) items=items.filter(i=>(i.keywords||[]).indexOf(filterKw)>=0);
  const el=document.getElementById("rows");
  if(!items.length){ el.innerHTML='<tr><td colspan="8" class="muted">Порожньо</td></tr>'; return; }
  el.innerHTML=items.map(function(i,idx){
    const rx=rxHtml(i.reactions_json||i.reactions);
    let replies=[]; try{replies=typeof i.replies_json==="string"?JSON.parse(i.replies_json||"[]"):(i.replies_json||[])}catch(e){}
    const badge=(i.reply_count||replies.length||0)+"↩"+(rx?" · ☺":"");
    const thread=replies.map(r=>'<div class="muted" style="margin:6px 0 0 12px"><b>'+(r.user||"")+'</b> '+(r.text||"")+(r.reactions&&r.reactions.length?" · "+rxHtml(r.reactions):"")+"</div>").join("");
    return '<tr data-i="'+idx+'"><td>+</td><td class="mono">'+String(i.msg_at||"").replace("T"," ").slice(0,19)
      +"</td><td>#"+(i.channel_name||i.channel_id||"")+"</td><td>"+(i.author_name||"—")+"</td><td>"+(i.mentioned||"")
      +'</td><td>'+emojify(i.text_short||"").replace(/</g,"&lt;")+"</td><td>"+badge+'</td><td>'
      +(i.permalink?'<a href="'+i.permalink+'" target="_blank">msg</a>':"—")+"</td></tr>"
      +'<tr class="exp" id="full-'+idx+'" style="display:none"><td colspan="8"><pre style="white-space:pre-wrap">'
      +emojify(i.text_full||"").replace(/</g,"&lt;")+"</pre><div>"+rx+"</div>"+thread+"</td></tr>";
  }).join("");
  el.onclick=function(e){
    const tr=e.target.closest("tr[data-i]"); if(!tr) return;
    const n=document.getElementById("full-"+tr.dataset.i);
    if(n) n.style.display=n.style.display==="none"?"":"none";
  };
}
async function load(){
  try{
    const [kw,pe,it]=await Promise.all([
      fetch(API+"/keywords?day="+dayEl.value).then(r=>r.json()),
      fetch(API+"/people?day="+dayEl.value).then(r=>r.json()),
      fetch(API+"/mentions?"+qs()).then(r=>r.json())
    ]);
    document.getElementById("kw").innerHTML=(kw.today||[]).map(k=>'<button type="button" class="'+(filterKw===k.word?"on":"")+'" data-w="'+k.word+'">'+k.word+" · "+k.n+"</button>").join("")
      || '<span class="muted">Немає ключів за день (рядків: '+((it.items||[]).length)+')</span>';
    document.getElementById("kw").onclick=function(e){
      const b=e.target.closest("button"); if(!b) return;
      filterKw=filterKw===b.dataset.w?"":b.dataset.w;
      load();
    };
    window._layer=window._layer||{who:"",author:""};
    const crumb=document.getElementById("team-crumb");
    if(window._layer.author) crumb.textContent=" / "+window._layer.who+" / "+window._layer.author;
    else if(window._layer.who) crumb.textContent=" / "+window._layer.who+" · автори";
    else crumb.textContent="";
    if(window._layer.who && !window._layer.author){
      const au=await fetch(API+"/people?day="+dayEl.value+"&who="+encodeURIComponent(window._layer.who)).then(r=>r.json());
      document.getElementById("people").innerHTML='<tr data-back="1"><td colspan="5" class="muted">← до команди</td></tr>'+(au.authors||[]).filter(a=>Number(a.total_count||0)).map(a=>'<tr data-author="'+(a.author||"")+'"><td>'+(a.author||"—")+"</td><td>автор</td><td>"+(a.total_count||0)+"</td><td><b>"+(a.today_count||0)+"</b></td><td class=mono>"+String(a.last_at||"—").replace("T"," ").slice(0,19)+"</td></tr>").join("");
    } else if(!window._layer.who){
      document.getElementById("people").innerHTML=(pe.people||[]).filter(p=>p.mention_type==="team"||Number(p.total_count||0)||Number(p.today_count||0)).map(p=>{
        const stale=Number(p.stale_team||0);
        const cls=stale?" style=\"background:#7f1d1d;color:#fecaca\"":"";
        return "<tr data-who=\""+p.mentioned+"\""+cls+"><td>"+p.mentioned+(stale?" · ⚠ "+stale:"")+"</td><td>"+p.mention_type+"</td><td>"+(p.total_count||0)+"</td><td><b>"+(p.today_count||0)+"</b></td><td class=mono>"+String(p.last_at||"—").replace("T"," ").slice(0,19)+"</td></tr>";
      }).join("") || '<tr><td colspan="5" class="muted">Немає людей з OnCall</td></tr>';
    }
    document.getElementById("people").onclick=function(e){
      const back=e.target.closest("tr[data-back]");
      if(back){ if(window._layer.author) window._layer.author=""; else window._layer.who=""; load(); return; }
      const au=e.target.closest("tr[data-author]");
      if(au){ window._layer.author=au.dataset.author; filterWho=window._layer.who; load(); return; }
      const tr=e.target.closest("tr[data-who]"); if(!tr) return;
      window._layer.who=tr.dataset.who; window._layer.author=""; filterWho=window._layer.who; load();
    };
    renderItems(it.items||[]);
  }catch(e){
    document.getElementById("kw").textContent=String(e);
  }
}
document.getElementById("bf").onclick=async function(){
  const s=document.getElementById("bfst"); s.textContent="запуск…";
  try{
    const r=await fetch(API+"/backfill");
    const txt=await r.text();
    const d=txt?JSON.parse(txt):{};
    s.textContent=(d.status||"ok")+" …";
    let st=d;
    for(let i=0;i<15 && st.status==="running";i++){
      await new Promise(res=>setTimeout(res,2000));
      st=await fetch(API+"/backfill/status").then(x=>x.json());
    }
    const res=st.result||st;
    s.textContent="додано "+(res.ingested||0)+" · "+(res.mode||st.status||"");
    load();
  }catch(e){ s.textContent=String(e); }
};
dayEl.onchange=load;
document.getElementById("hist").onchange=load;
load();
</script>
</script>
</body></html>
